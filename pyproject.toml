[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qviz"
version = "0.1.0"
description = "Educational trapped-ion circuit visualizer for Qollab"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "qiskit>=2.5.2,<3.0.0",
    "qiskit-ionq>=1.0.0,<2.0.0",
    "numpy>=2.0,<3.0",
    "qiskit-qasm3-import>=0.6,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jsonschema",
    "flake8",
    "pydocstyle",
]

[tool.setuptools.packages.find]
include = ["backend*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pydocstyle]
convention = "pep257"
