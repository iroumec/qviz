project:
  type: book

book:
  title: "QViz Overflow"
  author: "Iñaki Roumec"
  date: last-modified
  chapters:
    - 
    - documentation/docs/index.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
  typst:
    document-class: book
    include-in-header:
      - text: |
          #set par(leading: 1.35em)
          #set page(margin: (x: 3.2cm, y: 3.0cm))
          #show heading: set block(above: 2.0em, below: 1.0em)
          #show table: set table(
            stroke: 0.5pt,
            inset: 8pt,
          )