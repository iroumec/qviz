project:
  type: book

book:
  title: "QViz Documentation"
  author: "Qubit Overflow"
  date: last-modified
  search: true
  chapters:
    - index.qmd
    - docs/index.qmd
    - part: "Introduction"
      chapters:
        - docs/concepts/motivation.qmd
    - part: "Getting started"
      chapters:
        - docs/getting-started/installation.qmd
        - docs/getting-started/quickstart.qmd
        - docs/getting-started/tests-and-demos.qmd
        - docs/getting-started/limitations.qmd
    - part: "Core concepts"
      chapters:
        - docs/concepts/pipeline-overview.qmd
        - docs/concepts/units-and-conventions.qmd
        - docs/concepts/json-contract.qmd
    - part: "Architecture"
      chapters:
        - docs/architecture/system-overview.qmd
        - docs/architecture/project-structure.qmd
        - docs/architecture/entry-points.qmd
        - docs/architecture/engineering-practices.qmd
    - part: "Backend foundations"
      chapters:
        - docs/modules/config-and-errors.qmd
        - docs/modules/model.qmd
        - docs/modules/provider.qmd
    - part: "Backend input and translation"
      chapters:
        - docs/modules/importer.qmd
        - docs/modules/transpiler.qmd
        - docs/modules/translator.qmd
        - docs/modules/to-qiskit.qmd
    - part: "Backend simulation and output"
      chapters:
        - docs/modules/simulator.qmd
        - docs/modules/vectorizer.qmd
        - docs/modules/metrics.qmd
        - docs/modules/formatter-and-exporter.qmd
    - part: "Backend orchestration and extras"
      chapters:
        - docs/modules/compiler.qmd
        - docs/modules/sampler.qmd
        - docs/modules/tomography.qmd
    - part: "Examples"
      chapters:
        - docs/examples/qft-adder.qmd
        - docs/examples/performance.qmd
    - part: "Frontend"
      chapters:
        - docs/frontend/architecture.qmd
        - docs/frontend/viewer.qmd
        - docs/frontend/qollab.qmd
    - part: "Development"
      chapters:
        - docs/development/tests.qmd
        - docs/development/demos.qmd
        - docs/development/tooling.qmd
        - docs/development/style-and-conventions.qmd

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    highlight-style: monochrome
  typst:
    document-class: book
    include-before-body:
      - text: |
          // Tidy the part divider pages of orange-book, whose defaults assume a
          // single-glyph part number. The part number is made smaller so a wide
          // numeral such as "VIII" does not run into the part title. The mini
          // table of contents keeps its default depth (chapters and sections):
          // each part is small enough for it to fit.
          #import "@preview/orange-book:0.7.1" as orange-book
          #orange-book.part-font-size-state.update(x => 8em)
    include-in-header:
      - text: |
          #set par(leading: 1.35em)
          #set page(margin: (x: 3.2cm, y: 3.0cm))
          #show link: set text(fill: rgb("#18181b"))
          #show heading: set block(above: 2.0em, below: 1.0em)
          #show heading: set text(fill: rgb("#101013"))
          #show table: set table(
            stroke: 0.5pt,
            inset: 8pt,
          )
