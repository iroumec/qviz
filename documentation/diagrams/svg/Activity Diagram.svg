@startuml "Activity Diagram"


skinparam monochrome true

skinparam backgroundColor       #FFFFFF
skinparam shadowing             false
skinparam roundcorner           0
skinparam defaultFontName       Helvetica
skinparam defaultFontSize       12
skinparam ArrowFontSize         11
skinparam ParticipantFontSize   12
skinparam NoteFontSize          11
skinparam TitleFontSize         15
skinparam LegendFontSize        11
skinparam GroupFontSize         11

skinparam ArrowThickness        1
skinparam ParticipantBorderThickness 1
skinparam LifeLineThickness     1

start

:Quantum Circuit; <<object>>

:Transpiler;

:Transpiled Quantum Circuit; <<object>>

:Normalizer/Translator;

:IonQ Transpiled Quantum Circuit; <<object>>

:State Calculator / Simulator;

:Simulated Circuit (angles); <<object>>

:Vectorizer;

:Vectorized Circuit (vectors instead of angles); <<object>>

:Formatter;

:JSON; <<object>>

end

@enduml

