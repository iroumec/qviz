@startuml DataModel


skinparam monochrome true

skinparam backgroundColor       #FFFFFF
skinparam shadowing             false
skinparam roundcorner           0
skinparam defaultFontName       Helvetica
skinparam defaultFontSize       12
skinparam ArrowFontSize         11
skinparam ParticipantFontSize   12
skinparam NoteFontSize          11
skinparam TitleFontSize         15
skinparam LegendFontSize        11
skinparam GroupFontSize         11

skinparam ArrowThickness        1
skinparam ParticipantBorderThickness 1
skinparam LifeLineThickness     1

title Data model

class NoiseProfile
class BackendInfo
class TranspiledCircuit
class NativeOp
class NativeCircuit
class SimulatedCircuit
class VectorizedCircuit
class MeasuredCircuit

BackendInfo *- - NoiseProfile
NativeCircuit *- - BackendInfo
NativeCircuit *- - NativeOp
SimulatedCircuit *- - NativeCircuit
VectorizedCircuit *- - NativeCircuit
MeasuredCircuit *- - NativeCircuit

note right of NativeCircuit
  Frozen dataclasses, defined in
  backend/core/model.py. An object
  between two stages is never changed.
end note

@enduml

