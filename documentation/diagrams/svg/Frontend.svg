@startuml Frontend


skinparam monochrome true

skinparam backgroundColor       #FFFFFF
skinparam shadowing             false
skinparam roundcorner           0
skinparam defaultFontName       Helvetica
skinparam defaultFontSize       12
skinparam ArrowFontSize         11
skinparam ParticipantFontSize   12
skinparam NoteFontSize          11
skinparam TitleFontSize         15
skinparam LegendFontSize        11
skinparam GroupFontSize         11

skinparam ArrowThickness        1
skinparam ParticipantBorderThickness 1
skinparam LifeLineThickness     1

title Frontend data flow

rectangle "Backend (Python)\ncompile() -> JSON" as backend
rectangle "Viewer (frontend/index.html)\nvanilla JavaScript" as viewer
rectangle "Scene (three.js)\nshaders bloch.vert + bloch.frag\ninstanced chain of Bloch spheres" as scene
rectangle "Panels\nhealth, details, p(|1), frames" as panels

backend -down-> viewer : JSON text
viewer -down-> scene : instancePsi, iTime
viewer -down-> panels : fields of the step

rectangle "Qollab build\nmake qollab" as qollab
qollab .down.> viewer : reuses, does not rewrite

@enduml

