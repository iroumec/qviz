# Continuous integration: linting and tests.
#
# Runs on every push to the long-lived branches and on every pull request.
# The linting rules (flake8 and pydocstyle) live in `.flake8` and in
# `pyproject.toml`, and are the same as those of `make lint`. The tests are the
# same as those of `make test`.

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

# Only the latest run of a branch is kept, to save runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install the linters
        run: |
          python -m pip install --upgrade pip flake8 pydocstyle
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the style (flake8)
        run: python -m flake8 source/backend resources/examples main.py qollab_api.py resources/scripts source/tests

      - name: Check the docstrings (pydocstyle)
        run: python -m pydocstyle source/backend resources/examples

      - name: Check the viewer modules (ESLint)
        run: pnpm run lint

      - name: Audit the JavaScript dependencies
        run: pnpm audit --audit-level=high

      - name: Build the Qollab package
        run: python resources/scripts/package_qollab.py

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render the book (HTML)
        run: quarto render documentation --to html

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ``requires-python`` is >=3.12. Python 3.14 is what Qollab runs on
        # Pyodide, so it is tested too.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and the developer tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the tests
        shell: bash
        run: |
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            python -m pytest source/tests/ -v \
              --cov=source/backend --cov-report=term-missing --cov-fail-under=90
          else
            python -m pytest source/tests/ -v
          fi
