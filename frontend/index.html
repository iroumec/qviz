<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloch Sphere - Instanced Attributes</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #fps-counter {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 100;
        }
        #instructions {
            position: absolute;
            top: 50%; width: 100%; text-align: center;
            color: #fff; font-family: sans-serif; font-size: 18px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
<div id="fps-counter">FPS: 0</div>
<div id="instructions">Click para iniciar (WASD: Mover, Mouse: Mirar)</div>

<script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    let camera, scene, renderer, material;
    let uniforms, controls;
    let clock = new THREE.Clock();
    
    let frames = 0;
    let prevTime = performance.now();
    const fpsElement = document.getElementById('fps-counter');
    const instructions = document.getElementById('instructions');

    const move = { forward: false, backward: false, left: false, right: false };
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    init();
    animate();

    function init() {
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0.001, 0.0, 0.017);

        const geometry = new THREE.BoxGeometry(2.6, 2.6, 2.6);

        uniforms = {
            iTime: { value: 0.0 },
            iResolution: { value: new THREE.Vector3() }
        };

        Promise.all([
            fetch('shaders/bloch.vert').then(res => res.text()),
            fetch('shaders/bloch.frag').then(res => res.text())
        ]).then(([vertexShader, fragmentShader]) => {
            material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                side: THREE.FrontSide, 
                transparent: true,
                depthWrite: true       
            });

            const count = 16;
            const mesh = new THREE.InstancedMesh(geometry, material, count);
            const dummy = new THREE.Object3D();
            const psiArray = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                dummy.position.set((i - 7.5) * 3.5, 0, 0);
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
                
                // ACA SE ASIGNAN LOS VALORES DE PSI PARA CADA INSTANCIA
                const phase = (i / count) * Math.PI * 2.0;
                psiArray[i * 3 + 0] = Math.sin(phase);
                psiArray[i * 3 + 1] = (i % 2 === 0) ? 0.5 : -0.5;
                psiArray[i * 3 + 2] = Math.cos(phase);
            }

            geometry.setAttribute('instancePsi', new THREE.InstancedBufferAttribute(psiArray, 3));

            scene.add(mesh);
        });

        renderer = new THREE.WebGLRenderer();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        controls = new PointerLockControls(camera, document.body);

        document.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => instructions.style.display = 'none');
        controls.addEventListener('unlock', () => instructions.style.display = 'block');

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': move.forward = true; break;
                case 'KeyA': case 'ArrowLeft': move.left = true; break;
                case 'KeyS': case 'ArrowDown': move.backward = true; break;
                case 'KeyD': case 'ArrowRight': move.right = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': move.forward = false; break;
                case 'KeyA': case 'ArrowLeft': move.left = false; break;
                case 'KeyS': case 'ArrowDown': move.backward = false; break;
                case 'KeyD': case 'ArrowRight': move.right = false; break;
            }
        });

        window.addEventListener('resize', onWindowResize);
        onWindowResize();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (uniforms) {
            uniforms.iResolution.value.set(renderer.domElement.width, renderer.domElement.height, 1);
        }
    }

    function animate() {
        requestAnimationFrame(animate);

        frames++;
        const time = performance.now();
        if (time >= prevTime + 1000) {
            fpsElement.innerText = 'FPS: ' + Math.round((frames * 1000) / (time - prevTime));
            frames = 0;
            prevTime = time;
        }

        const delta = clock.getDelta();

        if (controls && controls.isLocked) {
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.y -= velocity.y * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(move.forward) - Number(move.backward);
            direction.x = Number(move.right) - Number(move.left);
            direction.y = Number(move.up) - Number(move.down);
            direction.normalize(); 

            const speed = 40.0;
            if (move.forward || move.backward) velocity.z -= direction.z * speed * delta;
            if (move.left || move.right) velocity.x -= direction.x * speed * delta;
            if (move.up || move.down) velocity.y -= direction.y * speed * delta;

          
            camera.translateX(-velocity.x * delta);
            camera.translateY(-velocity.y * delta);
        }

        if (uniforms) {
            uniforms.iTime.value += delta;
        }

        if (renderer && scene && camera) {
            renderer.render(scene, camera);
        }
    }
</script>
</body>
</html>
