<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QViz - Visualizador de iones atrapados</title>
<style>
  :root {
    --bg: #0b0f1a; --panel: #131a2b; --panel-2: #1b2438; --text: #e6ecff;
    --muted: #8b98b8; --accent: #4f8cff; --target: #ffd166; --x: #ff6b6b;
    --y: #51cf66; --z: #4dabf7; --border: #26304a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  header .meta { color: var(--muted); font-size: 13px; }
  header .meta b { color: var(--text); font-weight: 600; }
  header .perf { color: var(--accent); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 20px; border-bottom: 1px solid var(--border); }
  button, .file-btn, select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button:hover, .file-btn:hover, select:hover { border-color: var(--accent); }
  select { cursor: pointer; max-width: 280px; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .step-label { color: var(--muted); min-width: 96px; text-align: right; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .stage-wrap { position: relative; min-height: 0; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .readouts { position: absolute; top: 8px; left: 8px; z-index: 2; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
  .readout { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .readout b { color: var(--text); width: 44px; }
  .readout .bar { width: 70px; height: 6px; border-radius: 3px; background: #101728; overflow: hidden; }
  .readout .bar > span { display: block; height: 100%; background: var(--accent); width: 0; }
  legend { position: absolute; bottom: 8px; left: 8px; z-index: 2; display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
  legend i { display: inline-block; width: 10px; height: 3px; margin-right: 4px; vertical-align: middle; }
  aside { background: var(--panel); border-left: 1px solid var(--border); padding: 14px; overflow: auto; }
  aside h2 { margin: 0 0 10px; font-size: 14px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
  aside td { padding: 3px 0; vertical-align: top; }
  aside td:first-child { color: var(--muted); padding-right: 8px; white-space: nowrap; }
  .op-badge { display: inline-block; background: var(--accent); color: #fff; border-radius: 4px; padding: 1px 7px; font-weight: 600; text-transform: uppercase; font-size: 11px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .error { color: var(--x); font-size: 13px; padding: 0 20px; }
  #shots {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; width: 84px; font-size: 13px;
  }
  .measure-panel {
    position: absolute; top: 12px; right: 12px; z-index: 3;
    width: 330px; max-height: calc(100% - 24px); overflow: auto;
    background: rgba(19, 26, 43, 0.97); border: 1px solid var(--accent);
    border-radius: 10px; padding: 12px; font-size: 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }
  .measure-panel.hidden { display: none; }
  .measure-panel h2 { font-size: 13px; margin: 0 0 6px; }
  .measure-panel .close { float: right; padding: 2px 8px; }
  .measure-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .measure-row .bits { font-family: ui-monospace, monospace; letter-spacing: 1px; }
  .measure-row .bar { flex: 1; height: 8px; background: #101728; border-radius: 4px; overflow: hidden; }
  .measure-row .bar > span { display: block; height: 100%; background: var(--accent); }
  .measure-row .pct { width: 48px; text-align: right; color: var(--muted); }
  .measure-panel hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .measure-panel table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .measure-panel td { padding: 1px 0; }
  .measure-panel td:first-child { color: var(--muted); white-space: nowrap; padding-right: 8px; }
  .health { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .health .health-bar {
    width: 170px; height: 10px; background: #101728; border: 1px solid var(--border);
    border-radius: 5px; overflow: hidden;
  }
  .health .health-bar > span {
    display: block; height: 100%; width: 100%; background: var(--y);
    transition: width .2s ease, background .2s ease;
  }
  .health .health-value {
    color: var(--text); min-width: 54px; text-align: right;
    font-variant-numeric: tabular-nums;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<header>
  <h1>QViz · iones atrapados</h1>
  <div class="meta" id="backendMeta">cargando…</div>
  <div class="health" id="health">
    <span>salud del circuito</span>
    <div class="health-bar"><span id="healthFill"></span></div>
    <span class="health-value" id="healthValue">100.00%</span>
  </div>
  <div class="perf" id="perfMeta"></div>
</header>

<div class="controls">
  <select id="fileSelect" title="Archivos generados en out/"></select>
  <label class="file-btn">Cargar JSON<input type="file" id="file" accept=".json,application/json" hidden /></label>
  <button id="prev">&larr;</button>
  <button id="play">Play</button>
  <button id="next">&rarr;</button>
  <button id="measure">Medir</button>
  <input type="number" id="shots" min="1" max="100000" step="1" value="1024" title="shots" />
  <input type="range" id="slider" min="0" max="0" value="0" />
  <span class="step-label" id="stepLabel">paso 0 / 0</span>
</div>
<div class="error" id="error"></div>

<main>
  <section class="stage-wrap">
    <div class="readouts" id="readouts"></div>
    <div id="stage"></div>
    <div class="measure-panel hidden" id="measurePanel"></div>
    <legend>
      <span><i style="background:#ff6b6b"></i>x</span>
      <span><i style="background:#4dabf7"></i>z (|0⟩ arriba)</span>
      <span><i style="background:#51cf66"></i>y</span>
      <span>arrastrar: rotar · rueda: zoom</span>
    </legend>
  </section>
  <aside id="details">
    <h2>Detalle del paso</h2>
    <p class="hint">Los archivos de <code>out/</code> se generan con
      <code>make outputs</code>. Arrastrá un JSON o elegilo en la lista.</p>
  </aside>
</main>

<script>
"use strict";

// The spheres are drawn with the volumetric raymarching shaders in shaders/.
// The JSON files are the ones generated by the project (make outputs); they are
// listed in out/manifest.json and loaded over HTTP.

const BOX = 2.6;
const SPACING = 3.0;
const VERT_URL = "../shaders/bloch.vert";
const FRAG_URL = "../shaders/bloch.frag";
const MANIFEST_URL = "../out/manifest.json";
const OUT_URL = "../out/";

let data = null;
let stepIndex = 0;
let playing = false;
let playTimer = null;

const qubits = [];
let vertShader = null;
let fragShader = null;

let renderer, scene, camera, world, instMesh, psiAttribute;
const orbit = { azimuth: 0.7, elevation: 0.32, zoom: 1, fitRadius: 16 };
const THREE_READY = typeof THREE !== "undefined";

let fpsFrames = 0;
let fpsLast = 0;
let fpsValue = 0;

// ---------------------------------------------------------------- utilities
function normalize(v) {
  const n = Math.hypot(v[0], v[1], v[2]);
  return n < 1e-12 ? [0, 0, 0] : [v[0] / n, v[1] / n, v[2] / n];
}

function showStageMessage(text) {
  document.getElementById("stage").innerHTML =
    `<p class="hint" style="padding:20px">${text}</p>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// ------------------------------------------------------------------ shaders
async function loadShaders() {
  const [vert, frag] = await Promise.all([
    fetch(VERT_URL).then((r) => { if (!r.ok) throw new Error(VERT_URL); return r.text(); }),
    fetch(FRAG_URL).then((r) => { if (!r.ok) throw new Error(FRAG_URL); return r.text(); }),
  ]);
  vertShader = vert;
  fragShader = frag;
}

function makeLabel(text) {
  const canvas = document.createElement("canvas");
  canvas.width = 128; canvas.height = 64;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#e6ecff";
  ctx.font = "bold 40px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 64, 34);
  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false })
  );
  sprite.scale.set(0.95, 0.48, 1);
  return sprite;
}

// ------------------------------------------------------------------ scene
function buildScene(n) {
  if (!renderer) { qubits.length = 0; return; }

  while (world.children.length) world.remove(world.children[0]);
  qubits.length = 0;

  const geometry = new THREE.BoxGeometry(BOX, BOX, BOX);
  psiAttribute = new THREE.InstancedBufferAttribute(new Float32Array(n * 3), 3);
  geometry.setAttribute("instancePsi", psiAttribute);

  const material = new THREE.ShaderMaterial({
    uniforms: {
      iTime: { value: 0 },
      iResolution: { value: new THREE.Vector3(1, 1, 1) },
    },
    vertexShader: vertShader,
    fragmentShader: fragShader,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });

  instMesh = new THREE.InstancedMesh(geometry, material, n);
  instMesh.frustumCulled = false;

  // A linear chain of ions, one behind another along the x axis.
  const dummy = new THREE.Object3D();
  for (let i = 0; i < n; i++) {
    const x = (i - (n - 1) / 2) * SPACING;
    dummy.position.set(x, 0, 0);
    dummy.updateMatrix();
    instMesh.setMatrixAt(i, dummy.matrix);

    const label = makeLabel("q" + i);
    label.position.set(x, 1.75, 0);
    world.add(label);

    qubits.push({
      label, current: [0, 0, 1], target: [0, 0, 1], vibration: 0, isTarget: false,
    });
  }
  instMesh.instanceMatrix.needsUpdate = true;
  world.add(instMesh);

  computeFitRadius();
}

function computeFitRadius() {
  if (!camera || qubits.length === 0) return;
  const halfX = ((qubits.length - 1) / 2) * SPACING + 1.8;
  const halfY = 1.8;
  const vFov = (camera.fov * Math.PI) / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  orbit.fitRadius = Math.max(
    halfX / Math.tan(hFov / 2), halfY / Math.tan(vFov / 2)
  ) + 1;
  updateCamera();
}

function updateCamera() {
  if (!camera) return;
  const { azimuth, elevation } = orbit;
  const radius = orbit.fitRadius * orbit.zoom;
  camera.position.set(
    radius * Math.sin(azimuth) * Math.cos(elevation),
    radius * Math.sin(elevation),
    radius * Math.cos(azimuth) * Math.cos(elevation)
  );
  camera.lookAt(0, 0, 0);
}

async function initThree() {
  if (!THREE_READY) {
    showStageMessage("three.js no se pudo cargar (se necesita conexión).");
    return false;
  }
  try {
    await loadShaders();
  } catch (err) {
    showStageMessage(
      "No se pudieron cargar los shaders de <code>shaders/</code>. " +
      "Serví el proyecto por HTTP (<code>python -m http.server</code>)."
    );
    return false;
  }

  const stage = document.getElementById("stage");
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0b0f1a, 1);
  stage.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);
  world = new THREE.Group();
  scene.add(world);

  let dragging = false;
  let prev = { x: 0, y: 0 };
  renderer.domElement.addEventListener("pointerdown", (e) => {
    dragging = true; prev = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener("pointerup", () => { dragging = false; });
  window.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    orbit.azimuth -= (e.clientX - prev.x) * 0.008;
    orbit.elevation = Math.max(
      -1.4, Math.min(1.4, orbit.elevation + (e.clientY - prev.y) * 0.008)
    );
    prev = { x: e.clientX, y: e.clientY };
    updateCamera();
  });
  renderer.domElement.addEventListener("wheel", (e) => {
    e.preventDefault();
    orbit.zoom = Math.max(0.25, Math.min(4, orbit.zoom * (1 + e.deltaY * 0.001)));
    updateCamera();
  }, { passive: false });

  window.addEventListener("resize", onResize);
  onResize();
  return true;
}

function onResize() {
  if (!renderer) return;
  const stage = document.getElementById("stage");
  const w = stage.clientWidth || 1;
  const h = stage.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (instMesh) instMesh.material.uniforms.iResolution.value.set(w, h, 1);
  computeFitRadius();
}

function animate(time) {
  requestAnimationFrame(animate);
  if (!renderer) return;

  const array = psiAttribute.array;
  for (let i = 0; i < qubits.length; i++) {
    const q = qubits[i];
    let moving = false;
    for (let k = 0; k < 3; k++) {
      const diff = q.target[k] - q.current[k];
      if (Math.abs(diff) > 1e-3) moving = true;
      q.current[k] += diff * 0.18;
    }
    if (!moving) q.current = q.target.slice();
    const disp = q.current.slice();
    // The wobble is shown only while the ion is moving to a new state, so that
    // the chain settles and does not keep dancing when a step is reached.
    if (moving && q.vibration > 0) {
      const wobble = q.vibration * 0.25 * Math.sin(time * 0.006);
      disp[0] += wobble;
      disp[1] += wobble * 0.5;
    }
    // Backend Bloch (x, y, z) -> shader (x, z, -y): |0> points up (+y).
    array[i * 3 + 0] = disp[0];
    array[i * 3 + 1] = disp[2];
    array[i * 3 + 2] = -disp[1];
    q.label.material.color.setHex(q.isTarget ? 0xffd166 : 0xe6ecff);
  }
  psiAttribute.needsUpdate = true;
  instMesh.material.uniforms.iTime.value = time * 0.001;

  renderer.render(scene, camera);

  fpsFrames += 1;
  if (time - fpsLast >= 500) {
    fpsValue = (fpsFrames * 1000) / (time - fpsLast);
    fpsFrames = 0;
    fpsLast = time;
    updatePerf();
  }
}

function updatePerf() {
  if (!data) return;
  document.getElementById("perfMeta").textContent =
    `${data.total_qubits} qubits · ${data.steps.length} pasos · ${fpsValue.toFixed(0)} fps`;
}

// The health of the circuit is its accumulated fidelity. Step 0 is the initial
// state, which starts at the initial fidelity of the backend.
function updateHealth(step) {
  if (!data) return;
  const value = step ? step.cumulative_fidelity : data.initial_fidelity;
  const clamped = Math.max(0, Math.min(100, value));
  const fill = document.getElementById("healthFill");
  fill.style.width = clamped + "%";
  fill.style.background =
    clamped >= 99 ? "#51cf66" : clamped >= 95 ? "#ffd166" : "#ff6b6b";
  document.getElementById("healthValue").textContent = clamped.toFixed(2) + "%";
}

// --------------------------------------------------------------- data logic
function initialState(n) {
  return Array.from({ length: n }, () => [0, 0, 1]);
}

function loadData(obj) {
  if (!obj || !Array.isArray(obj.steps) || typeof obj.total_qubits !== "number") {
    throw new Error("El JSON no tiene el contrato esperado (backend/steps).");
  }
  data = obj;
  stepIndex = 0;
  buildScene(data.total_qubits);
  buildReadouts(data.total_qubits);
  document.getElementById("backendMeta").innerHTML =
    `<b>${escapeHtml(data.backend)}</b> · fidelidad inicial <b>${data.initial_fidelity}%</b>`;
  const slider = document.getElementById("slider");
  slider.max = String(data.steps.length);
  slider.value = "0";
  document.getElementById("error").textContent = "";
  updateStep(0, true);
  updatePerf();
}

function loadFromText(text) {
  try {
    loadData(JSON.parse(text));
  } catch (err) {
    document.getElementById("error").textContent = "Error: " + err.message;
  }
}

function buildReadouts(n) {
  const container = document.getElementById("readouts");
  container.innerHTML = "";
  for (let q = 0; q < n; q++) {
    const row = document.createElement("div");
    row.className = "readout";
    row.innerHTML = `<b>q${q}</b><div class="bar"><span></span></div><span class="p1">0.00</span>`;
    container.appendChild(row);
  }
}

function updateStep(index, instant) {
  if (!data) return;
  closeMeasurement();
  stepIndex = Math.max(0, Math.min(data.steps.length, index));
  document.getElementById("slider").value = String(stepIndex);
  document.getElementById("stepLabel").textContent =
    `paso ${stepIndex} / ${data.steps.length}`;

  const step = stepIndex === 0 ? null : data.steps[stepIndex - 1];
  const states = step ? step.states : initialState(data.total_qubits);
  const targets = step ? new Set(step.targets) : new Set();

  for (let q = 0; q < qubits.length; q++) {
    const s = (states[q] || [0, 0, 1]).slice();
    qubits[q].target = s;
    qubits[q].isTarget = targets.has(q);
    qubits[q].vibration = step && step.vibration ? step.vibration[q] || 0 : 0;
    if (instant) qubits[q].current = s.slice();
  }
  updateReadouts(step);
  renderDetails(step);
  updateHealth(step);
}

function updateReadouts(step) {
  const rows = document.getElementById("readouts").children;
  for (let q = 0; q < rows.length; q++) {
    const p1 = step && step.probabilities ? step.probabilities[q][1] : 0;
    rows[q].querySelector(".bar > span").style.width = (100 * p1).toFixed(1) + "%";
    rows[q].querySelector(".p1").textContent = p1.toFixed(2);
  }
}

function renderDetails(step) {
  const aside = document.getElementById("details");
  if (!step) {
    aside.innerHTML = '<h2>Detalle del paso</h2><p class="hint">' +
      "Estado inicial: todos los iones en |0⟩.</p>";
    return;
  }
  const rows = [];
  rows.push(["operación", `<span class="op-badge">${step.operation}</span>`]);
  rows.push(["targets", "[" + step.targets.join(", ") + "]"]);
  if (step.phases) rows.push(["phases (rad)", step.phases.map((p) => p.toFixed(4)).join(", ")]);
  if (typeof step.angle === "number") rows.push(["angle (turnos)", step.angle.toFixed(4)]);
  rows.push(["fid. acumulada", step.cumulative_fidelity.toFixed(4) + " %"]);
  rows.push(["costo acum.", "$" + step.cumulative_cost.toFixed(6)]);
  rows.push(["virtual_z", "[" + step.virtual_z.map((v) => v.toFixed(3)).join(", ") + "]"]);
  rows.push(["inactividad", "[" + step.inactivity.join(", ") + "]"]);
  rows.push(["fidelidades", "[" + step.fidelities.map((f) => f.toFixed(2)).join(", ") + "]"]);
  rows.push(["vibración", "[" + step.vibration.map((v) => v.toFixed(3)).join(", ") + "]"]);
  aside.innerHTML = "<h2>Detalle del paso</h2><table>" +
    rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("") + "</table>";
}

// ------------------------------------------------------------ measurement
// The JSON only gives the per-qubit (reduced) probabilities and the per-qubit
// fidelity. A measurement is therefore sampled independently on every qubit.
// The fidelity is used as a readout error: the probability is pulled towards
// 0.5 by the factor f, so a noisier qubit gives a flatter distribution.
function closeMeasurement() {
  document.getElementById("measurePanel").classList.add("hidden");
}

function runMeasurement() {
  if (!data) return;
  const shots = Math.max(
    1, Math.min(100000, Math.round(Number(document.getElementById("shots").value) || 1024))
  );
  const n = data.total_qubits;
  const step = stepIndex === 0 ? null : data.steps[stepIndex - 1];

  const p1 = [];
  const fidelity = [];
  const radius = [];
  for (let q = 0; q < n; q++) {
    const base = step ? step.probabilities[q][1] : 0;
    const f = step ? step.fidelities[q] / 100 : 1;
    p1.push(0.5 + (base - 0.5) * f);
    fidelity.push(f);
    const state = step ? step.states[q] : [0, 0, 1];
    radius.push(Math.hypot(state[0], state[1], state[2]));
  }

  const counts = new Map();
  const ones = new Array(n).fill(0);
  for (let shot = 0; shot < shots; shot++) {
    const bits = new Array(n);
    for (let q = 0; q < n; q++) {
      const bit = Math.random() < p1[q] ? 1 : 0;
      bits[q] = bit;
      ones[q] += bit;
    }
    // Little-endian: qubit 0 is the rightmost character.
    const key = bits.slice().reverse().join("");
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  const sorted = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]);
  renderMeasurement(sorted, shots, p1, ones, fidelity, radius, n, stepIndex);
}

function renderMeasurement(sorted, shots, p1, ones, fidelity, radius, n, step) {
  const top = sorted.slice(0, 15);
  const rows = top
    .map(([bits, count]) => {
      const pct = (100 * count) / shots;
      return (
        `<div class="measure-row"><span class="bits">${bits}</span>` +
        `<div class="bar"><span style="width:${pct.toFixed(1)}%"></span></div>` +
        `<span class="pct">${pct.toFixed(1)}%</span></div>`
      );
    })
    .join("");

  const qubitRows = [];
  for (let q = 0; q < n; q++) {
    const measured = ones[q] / shots;
    qubitRows.push(
      `<tr><td>q${q}</td><td>p(|1⟩) ajustado ${p1[q].toFixed(3)} · ` +
        `medido ${measured.toFixed(3)} · fid ${(100 * fidelity[q]).toFixed(2)}%</td></tr>`
    );
  }

  const entangled = radius.some((r) => r < 0.999);
  const note = entangled
    ? '<p class="hint">Hay qubits entrelazados. El JSON solo trae las probabilidades ' +
      "marginales, así que el muestreo es independiente y no reproduce las " +
      "correlaciones del entrelazamiento.</p>"
    : "";

  document.getElementById("measurePanel").innerHTML =
    `<button class="close" id="measureClose">Cerrar</button>` +
    `<h2>Medición · paso ${step} · ${shots} shots</h2>` +
    `<p class="hint">La probabilidad se corrige con la fidelidad: ` +
    `p → 0.5 + (p − 0.5)·f.</p>` +
    `<div>${rows}</div>` +
    (sorted.length > top.length
      ? `<p class="hint">… y ${sorted.length - top.length} resultados más.</p>`
      : "") +
    `<hr /><table>${qubitRows.join("")}</table>` +
    note;

  document.getElementById("measurePanel").classList.remove("hidden");
  document.getElementById("measureClose").addEventListener("click", closeMeasurement);
}

// --------------------------------------------------- generated JSON loading
async function loadFile(name) {
  const response = await fetch(OUT_URL + name);
  if (!response.ok) throw new Error(name);
  loadData(await response.json());
}

async function loadManifest() {
  const select = document.getElementById("fileSelect");
  try {
    const response = await fetch(MANIFEST_URL);
    if (!response.ok) throw new Error("no manifest");
    const manifest = await response.json();
    select.innerHTML = "";
    for (const entry of manifest.files) {
      const option = document.createElement("option");
      option.value = entry.file;
      option.textContent = entry.label || entry.file;
      select.appendChild(option);
    }
    select.value = manifest.default || manifest.files[0].file;
    await loadFile(select.value);
  } catch (err) {
    select.innerHTML = '<option value="">(sin out/manifest.json)</option>';
    try { await loadFile("ghz16.json"); }
    catch (e1) {
      try { await loadFile("bell.json"); }
      catch (e2) { loadData(DEMO); }
    }
  }
}

// ------------------------------------------------------------------ controls
function startPlay() {
  if (!data) return;
  playing = true;
  document.getElementById("play").textContent = "Pausa";
  playTimer = setInterval(() => {
    if (stepIndex >= data.steps.length) { stopPlay(); return; }
    updateStep(stepIndex + 1);
  }, 700);
}
function stopPlay() {
  playing = false;
  document.getElementById("play").textContent = "Play";
  clearInterval(playTimer);
}

document.getElementById("file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (file) file.text().then(loadFromText);
});
document.getElementById("fileSelect").addEventListener("change", (e) => {
  stopPlay();
  loadFile(e.target.value).catch((err) => {
    document.getElementById("error").textContent = "No se pudo cargar " + err.message;
  });
});
document.getElementById("prev").addEventListener("click", () => { stopPlay(); updateStep(stepIndex - 1); });
document.getElementById("next").addEventListener("click", () => { stopPlay(); updateStep(stepIndex + 1); });
document.getElementById("play").addEventListener("click", () => { playing ? stopPlay() : startPlay(); });
document.getElementById("slider").addEventListener("input", (e) => { stopPlay(); updateStep(Number(e.target.value)); });
document.getElementById("measure").addEventListener("click", runMeasurement);

document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("drop"); });
document.addEventListener("dragleave", () => document.body.classList.remove("drop"));
document.addEventListener("drop", (e) => {
  e.preventDefault();
  document.body.classList.remove("drop");
  const file = e.dataTransfer.files[0];
  if (file) file.text().then(loadFromText);
});
