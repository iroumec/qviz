<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloch Sphere - Three.js</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<script>
    let camera, scene, renderer, material;
    let uniforms;

    init();
    animate();

    function init() {
        const container = document.createElement( 'div' );
        document.body.appendChild( container );

        camera = new THREE.OrthographicCamera( - 1, 1, 1, - 1, 0, 1 );
        scene = new THREE.Scene();

        const geometry = new THREE.PlaneGeometry( 2, 2 );

        uniforms = {
            iTime: { value: 1.0 },
            iResolution: { value: new THREE.Vector3() },
            iMouse: { value: new THREE.Vector4() }
        };

        Promise.all([
            fetch('shaders/bloch.vert').then(res => res.text()),
            fetch('shaders/bloch.frag').then(res => res.text())
        ]).then(([vertexShader, fragmentShader]) => {
            material = new THREE.ShaderMaterial( {
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader
            } );

            const mesh = new THREE.Mesh( geometry, material );
            scene.add( mesh );
        }).catch(err => console.error("Error cargando shaders:", err));

        renderer = new THREE.WebGLRenderer();
        renderer.setPixelRatio( window.devicePixelRatio );
        container.appendChild( renderer.domElement );

        onWindowResize();
        window.addEventListener( 'resize', onWindowResize );

        let isDragging = false;
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                uniforms.iMouse.value.x = e.clientX;
                uniforms.iMouse.value.y = window.innerHeight - e.clientY;
            }
        });
        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            uniforms.iMouse.value.z = 1.0;
            uniforms.iMouse.value.x = e.clientX;
            uniforms.iMouse.value.y = window.innerHeight - e.clientY;
        });
        document.addEventListener('mouseup', () => {
            isDragging = false;
            uniforms.iMouse.value.z = 0.0;
        });
    }

    function onWindowResize() {
        renderer.setSize( window.innerWidth, window.innerHeight );
        uniforms.iResolution.value.x = renderer.domElement.width;
        uniforms.iResolution.value.y = renderer.domElement.height;
        uniforms.iResolution.value.z = 1;
    }

    function animate( timestamp ) {
        requestAnimationFrame( animate );
        if (uniforms) {
            uniforms.iTime.value = timestamp / 1000;
        }
        if (renderer && scene && camera) {
            renderer.render( scene, camera );
        }
    }
</script>
</body>
</html>
