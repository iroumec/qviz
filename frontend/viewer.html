<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QViz - Visor básico del JSON</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #131a2b;
    --panel-2: #1b2438;
    --text: #e6ecff;
    --muted: #8b98b8;
    --accent: #4f8cff;
    --target: #ffd166;
    --x: #ff6b6b;
    --y: #51cf66;
    --z: #4dabf7;
    --border: #26304a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 20px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  header .meta { color: var(--muted); font-size: 13px; }
  header .meta b { color: var(--text); font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 20px; border-bottom: 1px solid var(--border);
  }
  button, .file-btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button:hover, .file-btn:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .step-label { color: var(--muted); min-width: 96px; text-align: right; }

  .qubits { display: flex; flex-wrap: wrap; gap: 16px; align-content: flex-start; }
  .qubit {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; width: 210px;
  }
  .qubit.target { border-color: var(--target); box-shadow: 0 0 0 1px var(--target) inset; }
  .qubit h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .qubit h3 .tag { color: var(--target); font-weight: 400; margin-left: 6px; font-size: 11px; }
  canvas { display: block; margin: 0 auto; }

  .metric { color: var(--muted); font-size: 12px; }
  .metric b { color: var(--text); }
  .probs { display: flex; gap: 6px; margin-top: 6px; }
  .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); width: 0; }
  .bar.one > span { background: var(--target); }
  .probs .lbl { color: var(--muted); font-size: 11px; }

  aside {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; height: fit-content;
  }
  aside h2 { margin: 0 0 10px; font-size: 14px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 12px; }
  aside td { padding: 3px 0; vertical-align: top; }
  aside td:first-child { color: var(--muted); padding-right: 8px; white-space: nowrap; }
  .op-badge {
    display: inline-block; background: var(--accent); color: #fff; border-radius: 4px;
    padding: 1px 7px; font-weight: 600; text-transform: uppercase; font-size: 11px;
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .drop { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .error { color: var(--x); font-size: 13px; padding: 0 20px; }
</style>
</head>
<body>
<header>
  <h1>QViz · visor básico</h1>
  <div class="meta" id="backendMeta">sin datos</div>
</header>

<div class="controls">
  <label class="file-btn">Cargar JSON<input type="file" id="file" accept=".json,application/json" hidden /></label>
  <button id="demo">Ejemplo</button>
  <button id="prev">&larr;</button>
  <button id="play">Play</button>
  <button id="next">&rarr;</button>
  <input type="range" id="slider" min="0" max="0" value="0" />
  <span class="step-label" id="stepLabel">paso 0 / 0</span>
</div>
<div class="error" id="error"></div>

<main>
  <section class="qubits" id="qubits"></section>
  <aside id="details">
    <h2>Detalle del paso</h2>
    <p class="hint">Arrastrá <code>out/bell.json</code> o usá “Cargar JSON”.</p>
  </aside>
</main>

<script>
"use strict";

// --- estado global -----------------------------------------------------------
let data = null;          // contrato JSON cargado
let stepIndex = 0;        // paso mostrado (0 = estado inicial)
let playing = false;
let playTimer = null;
let lastTime = 0;

const EPS = 1e-12;

// Un objeto por qubit con la geometría del canvas y el vector animado.
const quinits = [];

// --- utilidades --------------------------------------------------------------
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function initialState(numQubits) {
  return Array.from({ length: numQubits }, () => [0, 0, 1]); // |0...0>
}

function normalize(v) {
  const n = Math.hypot(v[0], v[1], v[2]);
  return n < EPS ? [0, 0, 0] : [v[0] / n, v[1] / n, v[2] / n];
}

// --- carga de datos ----------------------------------------------------------
function loadData(obj) {
  if (!obj || !Array.isArray(obj.steps) || typeof obj.total_qubits !== "number") {
    throw new Error("El JSON no tiene el contrato esperado (backend/steps).");
  }
  data = obj;
  stepIndex = 0;
  buildQubits(data.total_qubits);
  resetVectors();
  document.getElementById("backendMeta").innerHTML =
    `<b>${escapeHtml(data.backend)}</b> · ${data.total_qubits} qubits · ` +
    `fidelidad inicial <b>${data.initial_fidelity}%</b>`;
  const slider = document.getElementById("slider");
  slider.max = String(data.steps.length);
  slider.value = "0";
  document.getElementById("error").textContent = "";
  updateStep(0, true);
}

function loadFromText(text) {
  try {
    loadData(JSON.parse(text));
  } catch (err) {
    document.getElementById("error").textContent = "Error: " + err.message;
  }
}

// --- construcción del DOM ----------------------------------------------------
function buildQubits(n) {
  quinits.length = 0;
  const container = document.getElementById("qubits");
  container.innerHTML = "";
  for (let q = 0; q < n; q++) {
    const card = document.createElement("div");
    card.className = "qubit";
    card.id = "qubit-" + q;
    card.innerHTML =
      `<h3>ion ${q}<span class="tag"></span></h3>` +
      `<canvas width="180" height="180"></canvas>` +
      `<div class="metric">p(|1&gt;): <b class="p1">0.000</b></div>` +
      `<div class="probs">` +
      `  <div class="bar zero" title="p(|0⟩)"><span></span></div>` +
      `  <div class="bar one" title="p(|1⟩)"><span></span></div>` +
      `</div>`;
    container.appendChild(card);
    const canvas = card.querySelector("canvas");
    quinits.push({ card, canvas, ctx: canvas.getContext("2d"), current: [0, 0, 1], target: [0, 0, 1] });
  }
}

function resetVectors() {
  for (const qu of quinits) {
    qu.current = [0, 0, 1];
    qu.target = [0, 0, 1];
  }
}

// --- proyección 3D -> 2D -----------------------------------------------------
function project(v, radius) {
  const a = Math.PI / 6; // giro de 30° para dar perspectiva
  const px = v[0] * Math.cos(a) - v[1] * Math.sin(a);
  const py = v[2];
  const depth = v[0] * Math.sin(a) + v[1] * Math.cos(a);
  return [px * radius, -py * radius, depth];
}

function drawBloch(qu, time) {
  const ctx = qu.ctx;
  const size = qu.canvas.width;
  const cx = size / 2;
  const cy = size / 2;
  const R = size * 0.36;
  ctx.clearRect(0, 0, size, size);

  // esfera
  ctx.strokeStyle = "rgba(139,152,184,.55)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.stroke();

  // ecuador
  ctx.strokeStyle = "rgba(139,152,184,.35)";
  ctx.beginPath();
  for (let i = 0; i <= 64; i++) {
    const t = (i / 64) * Math.PI * 2;
    const [sx, sy] = project([Math.cos(t), Math.sin(t), 0], R);
    i === 0 ? ctx.moveTo(cx + sx, cy + sy) : ctx.lineTo(cx + sx, cy + sy);
  }
  ctx.stroke();

  // ejes
  drawAxis(ctx, cx, cy, R, [1, 0, 0], "--x", "#ff6b6b");
  drawAxis(ctx, cx, cy, R, [0, 1, 0], "y", "#51cf66");
  drawAxis(ctx, cx, cy, R, [0, 0, 1], "z", "#4dabf7");

  // etiquetas de polos
  ctx.fillStyle = "rgba(139,152,184,.8)";
  ctx.font = "11px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("|0⟩", cx, cy - R - 4);
  ctx.fillText("|1⟩", cx, cy + R + 12);

  // vector animado (con pequeña oscilación según vibration)
  const v = qu.current.slice();
  if (qu.vibration > 0) {
    const wobble = qu.vibration * 0.25 * Math.sin(time * 0.006);
    v[0] += wobble;
    v[1] += wobble * 0.5;
  }
  const [vx, vy, vz] = project(normalize(v), R);
  const tipX = cx + vx;
  const tipY = cy + vy;

  ctx.strokeStyle = "#ffd166";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();

  ctx.fillStyle = "#ffd166";
  ctx.beginPath();
  ctx.arc(tipX, tipY, 4.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawAxis(ctx, cx, cy, R, axis, label, color) {
  const [ax, ay] = project(axis, R);
  const [bx, by] = project(axis.map((c) => -c), R);
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx + bx, cy + by);
  ctx.lineTo(cx + ax, cy + ay);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = color;
  ctx.font = "10px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(label, cx + ax * 1.12, cy + ay * 1.12 - 3);
}

// --- actualización de estado -------------------------------------------------
function updateStep(index, instant) {
  if (!data) return;
  stepIndex = clamp(index, 0, data.steps.length);
  document.getElementById("slider").value = String(stepIndex);
  document.getElementById("stepLabel").textContent =
    `paso ${stepIndex} / ${data.steps.length}`;

  const step = stepIndex === 0 ? null : data.steps[stepIndex - 1];
  const states = step ? step.states : initialState(data.total_qubits);
  for (let q = 0; q < quinits.length; q++) {
    const s = normalize(states[q] || [0, 0, 1]);
    quinits[q].target = s;
    quinits[q].vibration = step && step.vibration ? step.vibration[q] || 0 : 0;
    if (instant) quinits[q].current = s.slice();
  }
  updateCards(step);
  renderDetails(step);
}

function updateCards(step) {
  const targets = step ? new Set(step.targets) : new Set();
  for (let q = 0; q < quinits.length; q++) {
    const qu = quinits[q];
    qu.card.classList.toggle("target", targets.has(q));
    qu.card.querySelector(".tag").textContent = targets.has(q) ? "objetivo" : "";
    if (step && step.probabilities) {
      const p1 = step.probabilities[q][1];
      qu.card.querySelector(".p1").textContent = p1.toFixed(3);
      qu.card.querySelector(".bar.zero > span").style.width = (100 * (1 - p1)).toFixed(1) + "%";
      qu.card.querySelector(".bar.one > span").style.width = (100 * p1).toFixed(1) + "%";
    } else {
      qu.card.querySelector(".p1").textContent = "0.000";
      qu.card.querySelector(".bar.zero > span").style.width = "100%";
      qu.card.querySelector(".bar.one > span").style.width = "0%";
    }
  }
}

function renderDetails(step) {
  const aside = document.getElementById("details");
  if (!step) {
    aside.innerHTML = "<h2>Detalle del paso</h2><p class=\"hint\">" +
      "Estado inicial: todos los iones en |0⟩.</p>";
    return;
  }
  const rows = [];
  rows.push(["operación", `<span class="op-badge">${step.operation}</span>`]);
  rows.push(["targets", "[" + step.targets.join(", ") + "]"]);
  if (step.phases) rows.push(["phases (rad)", step.phases.map((p) => p.toFixed(4)).join(", ")]);
  if (typeof step.angle === "number") rows.push(["angle (turnos)", step.angle.toFixed(4)]);
  rows.push(["fid. acumulada", step.cumulative_fidelity.toFixed(4) + " %"]);
  rows.push(["costo acum.", "$" + step.cumulative_cost.toFixed(6)]);
  rows.push(["virtual_z", "[" + step.virtual_z.map((v) => v.toFixed(3)).join(", ") + "]"]);
  rows.push(["inactividad", "[" + step.inactivity.join(", ") + "]"]);
  rows.push(["fidelidades", "[" + step.fidelities.map((f) => f.toFixed(2)).join(", ") + "]"]);
  rows.push(["vibración", "[" + step.vibration.map((v) => v.toFixed(3)).join(", ") + "]"]);
  aside.innerHTML = "<h2>Detalle del paso</h2><table>" +
    rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("") +
    "</table>";
}

// --- bucle de animación ------------------------------------------------------
function frame(time) {
  requestAnimationFrame(frame);
  const dt = lastTime ? time - lastTime : 16;
  lastTime = time;
  for (const qu of quinits) {
    qu.current = qu.current.map((c, i) => c + (qu.target[i] - c) * 0.18);
    drawBloch(qu, time);
  }
}

function startPlay() {
  if (!data) return;
  playing = true;
  document.getElementById("play").textContent = "Pausa";
  playTimer = setInterval(() => {
    if (stepIndex >= data.steps.length) {
      stopPlay();
      return;
    }
    updateStep(stepIndex + 1);
  }, 700);
}

function stopPlay() {
  playing = false;
  document.getElementById("play").textContent = "Play";
  clearInterval(playTimer);
}

// --- eventos -----------------------------------------------------------------
document.getElementById("file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (file) file.text().then(loadFromText);
});

document.getElementById("demo").addEventListener("click", () => loadData(DEMO));

document.getElementById("prev").addEventListener("click", () => {
  stopPlay();
  updateStep(stepIndex - 1);
});
document.getElementById("next").addEventListener("click", () => {
  stopPlay();
  updateStep(stepIndex + 1);
});
document.getElementById("play").addEventListener("click", () => {
  playing ? stopPlay() : startPlay();
});
document.getElementById("slider").addEventListener("input", (e) => {
  stopPlay();
  updateStep(Number(e.target.value));
});

document.addEventListener("dragover", (e) => {
  e.preventDefault();
  document.body.classList.add("drop");
});
document.addEventListener("dragleave", () => document.body.classList.remove("drop"));
document.addEventListener("drop", (e) => {
  e.preventDefault();
  document.body.classList.remove("drop");
  const file = e.dataTransfer.files[0];
  if (file) file.text().then(loadFromText);
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// --- ejemplo embebido (h(0) traducido) --------------------------------------
const DEMO = {
  backend: "demo → iones (referencia Aria)",
  total_qubits: 2,
  initial_fidelity: 99.5,
  steps: [
    {
      step: 1, operation: "virtual_z", targets: [0], cumulative_fidelity: 99.5,
      states: [[0, 0, 1], [0, 0, 1]], vibration: [0, 0], cumulative_cost: 0,
      probabilities: [[1, 0], [1, 0]], virtual_z: [3.141593, 0],
      inactivity: [0, 0], fidelities: [100, 100],
    },
    {
      step: 2, operation: "gpi2", targets: [0], phases: [1.570796],
      cumulative_fidelity: 99.47, states: [[1, 0, 0], [0, 0, 1]],
      vibration: [0, 0], cumulative_cost: 0.0003, probabilities: [[0.5, 0.5], [1, 0]],
      virtual_z: [3.141593, 0], inactivity: [0, 1], fidelities: [99.98, 99.99],
    },
    {
      step: 3, operation: "ms", targets: [0, 1], phases: [0, 0], angle: 0.25,
      cumulative_fidelity: 98.94, states: [[0, 0, 0], [0, 0, 0]],
      vibration: [0, 0], cumulative_cost: 0.0018,
      probabilities: [[0.5, 0.5], [0.5, 0.5]], virtual_z: [3.141593, 0],
      inactivity: [0, 1], fidelities: [99.46, 99.48],
    },
  ],
};

// Si se sirve por HTTP, intenta cargar el último JSON generado por los demos.
fetch("../out/bell.json")
  .then((r) => (r.ok ? r.json() : Promise.reject()))
  .then(loadData)
  .catch(() => loadData(DEMO));

requestAnimationFrame(frame);
</script>
</body>
</html>
